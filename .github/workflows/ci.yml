name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, build check & Swagger docs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxis (lint básico)
        run: npm run lint

      - name: Verificar que la especificación Swagger se genera correctamente
        run: npm run verify-docs

      - name: Verificar que el servidor arranca
        run: |
          DB_HOST=localhost DB_PORT=5432 DB_NAME=ci DB_USER=ci DB_PASSWORD=ci \
          JWT_SECRET=ci_test_secret PORT=4000 NODE_ENV=test \
          node -e "
            const app = require('./server.js');
            const http = require('http');
            setTimeout(() => {
              http.get('http://localhost:4000/health', (res) => {
                console.log('Health check status:', res.statusCode);
                process.exit(res.statusCode === 200 ? 0 : 1);
              }).on('error', (err) => {
                console.error('Error al conectar:', err.message);
                process.exit(1);
              });
            }, 1000);
          "
